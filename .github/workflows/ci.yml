name: Plugins
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: ${{ matrix.plugin }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        plugin: [commands, secrets, scheduler, github-pr, vscode, shell-yeah, skills, mcp-pills, auth, auto-resume, git-diff, beautiful-chat]
        os: [ubuntu-latest]
        include:
          - plugin: secrets
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.plugin }}/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - if: matrix.plugin != 'beautiful-chat'
        run: npm run lint
      - if: matrix.plugin != 'beautiful-chat'
        run: npm run format:check
      - run: npm test

  agent-usage:
    name: Agent Usage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paseo-agent-usage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: paseo-agent-usage/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
