name: 功能需求 / Feature request
description: 为 Agent Usage 提一个功能想法 / Suggest a feature for Agent Usage
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请说明使用场景，而不是只描述实现方式。请勿粘贴凭据、prompt 或代码。
        Describe the use case rather than only the implementation. Never paste credentials, prompts, or code.
  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / Use case
      description: 你现在遇到什么问题，或想完成什么工作？ / What are you trying to do, and what gets in the way?
      placeholder: 我希望在 ... 时能看到 ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案 / Proposed solution
      description: 你希望插件如何呈现或交互？ / How should the plugin look or behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives considered
      description: 你目前是怎么绕过这个问题的？ / How do you work around it today?
  - type: dropdown
    id: area
    attributes:
      label: 相关模块 / Area
      options:
        - 用量总览 / Usage overview
        - 会话与会话明细 / Sessions and details
        - 成本与预算 / Cost and budget
        - 主机与远程采集 / Hosts and remote collection
        - 设置与语言 / Settings and language
        - 其他 / Other
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息 / Additional context
      description: 截图、参考链接或其他说明。 / Screenshots, references, or anything else.
