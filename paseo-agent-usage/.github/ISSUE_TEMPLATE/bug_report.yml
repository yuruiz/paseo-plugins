name: 报告问题 / Bug report
description: 报告 Agent Usage 的问题 / Report a problem with Agent Usage
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿粘贴凭据、prompt、代码或未脱敏的日志内容。
        Thanks for reporting. Never paste credentials, prompts, code, or unredacted log content.
  - type: input
    id: plugin-version
    attributes:
      label: 插件版本 / Plugin version
      placeholder: 0.7.0
    validations:
      required: true
  - type: input
    id: paseo-version
    attributes:
      label: Paseo 版本 / Paseo version
      placeholder: 0.13.0-beta.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统 / Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1. 打开 ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果 / Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果 / Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图 / Logs or screenshots
      description: 可运行 `paseo plugin logs agent-usage-plugin`，请先脱敏。 / Run `paseo plugin logs agent-usage-plugin`; redact before posting.
      render: shell
